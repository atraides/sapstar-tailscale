# Validations for the SAPstar Network Tailscale Configuration role
---
- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts.get("os_family") == 'Debian'
      - ansible_facts.get("distribution_release") is defined
    fail_msg: >-
      The sapstar.tailscale.config_machine role currently supports Debian/Ubuntu
      hosts with a detected distribution codename.

- name: Validate configuration parameters are a mapping
  ansible.builtin.assert:
    that:
      - config_machine_params is mapping
    fail_msg: >-
      config_machine_params must be a mapping containing the desired Tailscale
      settings.

- name: Validate configuration parameter names
  ansible.builtin.assert:
    that:
      - config_machine_unsupported_params | length == 0
    fail_msg: >-
      Unsupported Tailscale configuration parameter(s):
      {{ config_machine_unsupported_params | join(', ') }}
  vars:
    config_machine_supported_params:
      - accept_dns
      - accept_routes
      - advertise_routes
      - auto_update
      - snat_subnet_routes
      - update_check
    config_machine_unsupported_params: >-
      {{ config_machine_params.keys()
         | difference(config_machine_supported_params) }}

- name: Read current Tailscale status
  become: true
  become_exe: >-
    {{ 'sudo.ws' if 'sudo-rs' in (ansible_facts.packages | default({})) else
    'sudo' }}
  sapstar.tailscale.status:
  register: config_machine_status
  changed_when: false

- name: Determine whether Tailscale node is enrolled
  ansible.builtin.set_fact:
    config_machine_is_enrolled: >-
      {{ (config_machine_status.status.backend_state | default('NoState'))
         in config_machine_enrolled_states }}
  vars:
    config_machine_enrolled_states:
      - Stopped
      - Starting
      - Running
