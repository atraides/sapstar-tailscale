---
- name: Load variables
  ansible.builtin.include_tasks: load_variables.yml

- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == 'Debian'
      - ansible_facts["distribution_release"] is defined
    fail_msg: >-
      The sapstar.tailscale.install role currently supports Debian/Ubuntu
      hosts with a detected distribution codename.

- name: Configure Tailscale repository and install package
  become: true
  become_exe: >-
    {{ 'sudo.ws' if 'sudo-rs' in (ansible_facts.packages | default({}))
    else 'sudo' }}
  when: deploy_enabled | bool
  block:
    - name: Configure the signed Tailscale repository and package
      ansible.builtin.include_tasks: repository.yml

    - name: Install the Tailscale package
      ansible.builtin.include_tasks: install.yml

- name: Enroll to Tailscale
  ansible.builtin.include_tasks: enroll.yml
